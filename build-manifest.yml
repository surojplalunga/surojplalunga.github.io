name: Build Content Manifest
on:
  schedule:
    - cron: '0 0 * * *'               # daily at midnight UTC
  push:
    branches: [main]
  workflow_dispatch:                    # manual trigger

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest using gh CLI
        env:
          GH_USER: u9iver63                       # ← target account
          GH_TOKEN: ${{ secrets.U9IVER63_TOKEN }} # ← personal access token from that account
        run: |
          echo "[]" > manifest.json
          repos=$(gh repo list $GH_USER --limit 100 --json name,defaultBranch,description,language,pushedAt,stargazers_count,forks_count,html_url,isFork --jq '.[] | select(.isFork | not)')
          result="[]"
          for repo in $(echo "$repos" | jq -r '.name'); do
            repo_obj=$(echo "$repos" | jq --arg name "$repo" '.[] | select(.name == $name)')
            branch=$(echo "$repo_obj" | jq -r '.defaultBranch')
            echo "Processing $repo ($branch)..."
            tree=$(gh api "repos/$GH_USER/$repo/git/trees/$branch?recursive=1" --jq '.tree')
            pdfs=$(echo "$tree" | jq '[.[] | select(.type == "blob" and (.path | test("\\.pdf$";"i"))) | {path: .path, size: .size}]')
            mds=$(echo "$tree" | jq '[.[] | select(.type == "blob" and (.path | test("\\.md$";"i"))) | {path: .path}]')
            combined=$(echo "$repo_obj" | jq --argjson pdfs "$pdfs" --argjson mds "$mds" '. + {pdfs: $pdfs, mds: $mds}')
            result=$(echo "$result" | jq --argjson obj "$combined" '. + [$obj]')
          done
          echo "$result" > manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update content manifest [skip ci]"
          git push
