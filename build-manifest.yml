name: Build Content Manifest
on:
  schedule:
    - cron: '0 0 * * *'               # run every day at midnight UTC
  push:
    branches: [main]                   # also run when you push to main
  workflow_dispatch:                    # allow manual trigger from Actions tab

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # needed to commit the manifest back
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest using gh CLI
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          echo "[]" > manifest.json    # start with empty array
          repos=$(gh repo list $GH_USER --limit 100 --json name,defaultBranch,description,language,pushedAt,stargazers_count,forks_count,html_url --jq '.[] | select(.isFork | not)')
          # The line above already filters out forks – if not, we can filter later
          # Build JSON array
          result="[]"
          for repo in $(echo "$repos" | jq -r '.name'); do
            # Get full repo object
            repo_obj=$(echo "$repos" | jq --arg name "$repo" '.[] | select(.name == $name)')
            branch=$(echo "$repo_obj" | jq -r '.defaultBranch')
            echo "Processing $repo ($branch)..."
            # Fetch recursive tree
            tree=$(gh api "repos/$GH_USER/$repo/git/trees/$branch?recursive=1" --jq '.tree')
            # Extract PDFs and MDs
            pdfs=$(echo "$tree" | jq '[.[] | select(.type == "blob" and (.path | test("\\.pdf$";"i"))) | {path: .path, size: .size}]')
            mds=$(echo "$tree" | jq '[.[] | select(.type == "blob" and (.path | test("\\.md$";"i"))) | {path: .path}]')
            # Combine
            combined=$(echo "$repo_obj" | jq --argjson pdfs "$pdfs" --argjson mds "$mds" '. + {pdfs: $pdfs, mds: $mds}')
            result=$(echo "$result" | jq --argjson obj "$combined" '. + [$obj]')
          done
          echo "$result" > manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update content manifest [skip ci]"
          git push
