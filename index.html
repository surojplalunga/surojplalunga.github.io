function renderMarkdown(rawText, targetElement, fileRawUrl) {
  if (typeof marked === 'undefined') { targetElement.textContent = rawText; return; }
  targetElement.innerHTML = marked.parse(rawText);
  if (typeof renderMathInElement !== 'undefined') {
    try {
      renderMathInElement(targetElement, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],

      });

let videosLoaded = false;

async function loadVideos() {
  const loadingEl = document.getElementById('video-loading');
  const container = document.getElementById('video-list-container');
  const retryEl = document.getElementById('retry-videos');

  if (!YOUTUBE_CHANNEL_ID || YOUTUBE_CHANNEL_ID.startsWith('@') || !YOUTUBE_CHANNEL_ID.startsWith('UC')) {

  loadingEl.style.display = 'block';
  retryEl.style.display = 'none';

  try {
    const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${YOUTUBE_CHANNEL_ID}`;
    const response = await fetch(rssUrl);
    if (!response.ok) throw new Error('RSS not available');
    const text = await response.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'application/xml');
    const entries = xml.querySelectorAll('entry');
    if (!entries.length) throw new Error('No videos found');

    container.innerHTML = '';
    entries.forEach(entry => {
      const title = entry.querySelector('title')?.textContent || 'Untitled';
      const link = entry.querySelector('link')?.getAttribute('href') || '';
      const published = entry.querySelector('published')?.textContent || '';
      const mediaGroup = entry.querySelector('media\\:group, group');
      const thumbnail = mediaGroup?.querySelector('media\\:thumbnail, thumbnail')?.getAttribute('url') || '';
      const videoId = link.split('v=')[1]?.split('&')[0] || '';

          <span class="video-date">${new Date(published).toLocaleDateString()}</span>
          <span class="video-duration">▶ Play</span>

      });
